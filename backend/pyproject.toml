[project]
name = "tahqaq-api"
version = "0.1.0"
description = "Tahaqqaq (تحقّق) verification API: hadith and Islamic text verification"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "fastembed>=0.3.6",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "trafilatura>=1.12",
  "readability-lxml>=0.8",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "anthropic>=0.40",
  "sse-starlette>=2.1",
  "piper-tts>=1.3",
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*", "ingest*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
