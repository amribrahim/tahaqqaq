<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الصيام</title></head>
<body><main><h1>أقوال منتشرة عن الصيام</h1>
<ul>
<li>الصيام جُنّة.</li>
<li>قال رسول الله صلى الله عليه وسلم: صوموا تصحوا</li>
<li>من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه.</li>
</ul></main></body></html>
