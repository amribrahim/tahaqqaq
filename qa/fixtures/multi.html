<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>حديثان</title></head>
<body><main><h1>من جوامع الكلم</h1>
<p>الحديث الأول: قال رسول الله ﷺ: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى».</p>
<p>الحديث الثاني: قال رسول الله ﷺ: «الطهور شطر الإيمان».</p>
<p>وكلاهما من الأحاديث التي بُني عليها كثير من أبواب الفقه.</p>
</main></body></html>
