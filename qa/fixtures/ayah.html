<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>دعاء العلم</title></head>
<body><main><h1>الدعاء بزيادة العلم</h1>
<p>ينشر بعض الناس هذا النص على أنه حديث، فيكتبون: قال رسول الله: «وقل رب زدني علما»، وهو في الحقيقة آية من سورة طه.</p>
<p>وطلب العلم من أعظم القربات، وقد أمر الله نبيه أن يسأله الزيادة منه.</p>
</main></body></html>
