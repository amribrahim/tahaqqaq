<main><h1>فضل الطهارة</h1>
<p>الطهارة من أعظم شعائر الإسلام، وقد عدّها النبي شطر الإيمان كما في الحديث التالي.</p>
<blockquote>قال رسول الله ﷺ: الطهور شطر الإيمان والحمد لله تملأ الميزان</blockquote>
<p>فينبغي للمسلم أن يحرص على الوضوء والغسل وطهارة الثوب والمكان.</p>
</main><footer>تذييل</footer></body></html>
